# Xernix testnet daemon defaults.
# These can be overridden via environment variables on Reserved VM.

testnet=1
data-dir=/var/lib/xernix
log-file=/var/log/xernix/xernixd.log
log-level=1

p2p-bind-ip=0.0.0.0
p2p-bind-port=28080

rpc-bind-ip=0.0.0.0
rpc-bind-port=28081
restricted-rpc=1
confirm-external-bind=1

zmq-rpc-bind-ip=0.0.0.0
zmq-rpc-bind-port=28082

no-igd=1
non-interactive=1
